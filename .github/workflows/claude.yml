name: Claude

# Claude works on an issue or PR when I comment "@claude ..." on it (the monthly
# backlog workflow does this automatically for new backlog issues). Only my own
# comments trigger it, so nobody else can start a run on this public repo.
# When Claude pushed a branch for an issue, a pull request is opened in my name.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'nerminekabadou'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only the tools needed to change code and verify it with the project's own checks.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Bash(git status),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(terraform fmt:*),Bash(terraform init -backend=false:*),Bash(terraform validate),Bash(python -m py_compile:*)"
      - name: Open a pull request for the work
        if: success() && github.event.issue.pull_request == null
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
                   --jq "[.[].name | select(startswith(\"claude/issue-$ISSUE-\"))] | sort | last // empty")
          if [ -z "$branch" ]; then echo "Claude did not push a branch."; exit 0; fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$branch" --jq .ahead_by)" = "0" ]; then
            echo "Branch $branch has no new commits."; exit 0
          fi
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$branch" --json number --jq '.[0].number // empty')" ]; then
            echo "A pull request already exists for $branch."; exit 0
          fi
          printf 'Closes #%s\n\nImplemented by Claude Code; checks: `terraform fmt -check -recursive` and `terraform validate`. Merges after my approval.\n' "$ISSUE" > body.md
          gh pr create -R "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --title "$TITLE" --body-file body.md
